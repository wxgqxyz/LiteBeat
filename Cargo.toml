[workspace]
members = ["server"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "fs"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
toml = "0.9.5"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
